name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew ktlintCheck detekt --console=plain
      - run: ./gradlew :core:shell:test :core:optimization:test :app:testDebugUnitTest --console=plain

      # El catalogo esta versionado en `app/catalog`, asi que el APK se empaqueta
      # sin depender de carpetas externas.
      - name: Empaquetar APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Verificar build de release
        run: ./gradlew :app:assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
